name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'lychee-maven-plugin-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY || secrets.OSSRH_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Prepare release artifacts
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE || secrets.OSSRH_SIGNING_PASSPHRASE }}
        run: ./mvnw -B -Prelease -DskipTests verify

      - name: Publish to Fluxzero Packages with GitHub OIDC
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE || secrets.OSSRH_SIGNING_PASSPHRASE }}
        run: |
          set +x
          token=$(curl --fail --silent --show-error --get \
            --data-urlencode 'audience=https://packages.fluxzero.io/publish/maven' \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')
          echo "::add-mask::$token"
          export MAVEN_DEPLOY_TOKEN="$token"
          set -o pipefail
          ./mvnw -B -s .github/maven-settings.xml -Prelease -DskipTests deploy | tee "$RUNNER_TEMP/packages-deploy.log"

      - name: Collect exact Maven release assets from Packages
        run: python3 .github/scripts/collect-maven-assets.py --deploy-log "$RUNNER_TEMP/packages-deploy.log"

      - name: Attach Maven files to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" maven-release-assets/* --clobber

      - name: Determine Maven Central publication window
        id: central_window
        shell: bash
        run: |
          release_date="$(TZ=Europe/Amsterdam date +%F)"
          if [[ "$release_date" < "2026-10-01" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Maven Central publication"
              echo
              echo "Skipped: releases started on or after 1 October 2026 are published only to https://packages.fluxzero.io/maven."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to Maven Central
        if: steps.central_window.outputs.publish == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE || secrets.OSSRH_SIGNING_PASSPHRASE }}
        run: |
          ./mvnw -B -Prelease,central \
            -DskipTests \
            deploy

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: |
            target/bom.xml
            target/bom.json

      - name: Verify independent Packages consumer
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          bash .github/scripts/verify-packages-consumer.sh "$version"
