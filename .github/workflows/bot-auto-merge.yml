name: Bot Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: >
      github.repository == 'fluxzero-io/lychee-maven-plugin' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (
          github.actor == 'release-please[bot]' &&
          github.event.pull_request.user.login == 'release-please[bot]'
        ) ||
        startsWith(github.event.pull_request.head.ref, 'release-please--branches--main--components--lychee-maven-plugin')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.FLUXZERO_BOT_APP_ID }}
          private-key: ${{ secrets.FLUXZERO_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable PR auto-merge (squash)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
